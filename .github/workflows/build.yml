# Pulls the Google Sheet, checks it, builds data/data.json and publishes the site.
# Runs every night, whenever something is uploaded to the repository, and on demand
# (Actions tab > "Build and publish" > Run workflow).
# If the check fails, nothing is published and the live site keeps the last good version.
name: Build and publish

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the spreadsheet reader
        run: pip install openpyxl

      - name: 1. Pull the Google Sheet
        run: python scripts/pull.py

      - name: 2. Check the data
        run: python scripts/validate.py

      - name: 3. Build data.json
        run: python scripts/build.py

      - name: Save the data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data from the sheet" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
